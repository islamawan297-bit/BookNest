<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a free account on BookHub to place orders and manage your profile.">
    <title>Create Account - BookHub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">📚</span> BookHub
            </a>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation menu">☰</button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="books.html" class="nav-link">Books</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li id="adminLinkContainer"></li>
            </ul>
            <div class="nav-actions" id="navActions"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container section">
        <div class="form-card">
            <h2 style="font-size: 1.8rem; text-align: center; margin-bottom: 0.5rem;">Join BookHub</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.75rem;">Create an account to start ordering books online</p>

            <div id="alertContainer"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" id="regName" class="form-control" placeholder="John Doe">
                    <span class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="john@example.com">
                    <span class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters">
                    <span class="form-error"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password">
                    <span class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 BookHub – University Web Development Project.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
